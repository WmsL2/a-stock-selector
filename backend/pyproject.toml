[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-selector"
version = "0.1.0"
description = "Personal A-share quantitative research and stock selection system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.18.94,<2",
    "duckdb>=1.2,<2",
    "fastapi>=0.115,<1",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "pyarrow>=18,<25",
    "PyYAML>=6.0,<7",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27,<1",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.coverage.run]
source = ["stock_selector"]
data_file = ".cache/.coverage"

[tool.ruff]
target-version = "py312"
line-length = 88
cache-dir = ".cache/ruff"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["akshare"]
ignore_missing_imports = true
